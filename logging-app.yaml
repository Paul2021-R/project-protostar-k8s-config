apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: logging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=false

  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 6.x.x 
    
    helm:
      values: |
        loki:
          auth_enabled: false
          server:
            http_listen_port: 3100
            http_listen_address: 0.0.0.0
          common:
            ring:
              kvstore:
                store: inmemory
            replication_factor: 1
            path_prefix: /tmp/loki

          schemaConfig:
            configs:
              - from: "2020-05-15"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
          pattern_ingester:
            enabled: true
          limits_config:
            allow_structured_metadata: true
            volume_enabled: true 
          ruler:
            enable_api: true
          storage_config:
            filesystem:
              directory: /tmp/loki/chunks

          storage:
            type: filesystem
            bucketNames:
              chunks: loki-data-chunks
              ruler: loki-data-ruler
              admin: loki-data-admin
          #   s3:
          #     endpoint: logging-minio:9000
          #     insecure: true
          #     accessKeyId: admin
          #     secretAccessKey: supersecret

        deploymentMode: SingleBinary
        singleBinary:
          replicas: 1
          service:
            type: NodePort
            nodePort: 32280
        backend:
          replicas: 0
        read:
          replicas: 0
        write:
          replicas: 0
        ingester:
          replicas: 0
        querier:
          replicas: 0
        queryFrontend:
          replicas: 0
        queryScheduler:
          replicas: 0
        distributor:
          replicas: 0
        compactor:
          replicas: 0
        indexGateway:
          replicas: 0
        bloomCompactor:
          replicas: 0
        bloomGateway:
          replicas: 0

        minio:
          enabled: false
          # persistence:
          #   enabled: true
          #   storageClassName: microk8s-hostpath
          #   size: 10Gi

        promtail:
          enabled: true
          config:
            clients:
              - url: http://logging-loki:3100/loki/api/v1/push
          

          