apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: logging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # CRD 충돌 방지

  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 6.x.x 
    
    helm:
      values: |
        loki:
          image:
            tag: 3.6.0
            
          auth_enabled: false
          
          # [핵심] Monolithic 모드를 SingleBinary로 강제 지정
          deploymentMode: SingleBinary

          # [수정] Monolithic 모드(SingleBinary)에 필요한 설정을 명시
          singleBinary:
            replicas: 1
            persistence:
              enabled: true
              # MicroK8s에서 활성화한 기본 StorageClass 사용
              storageClassName: microk8s-hostpath 
              size: 10Gi

          # [저장소 설정] Loki 코드가 Filesystem을 사용하도록 명시
          storage:
            type: filesystem
            filesystem: {}
            bucketNames:
              chunks: loki-data-chunks
              ruler: loki-data-ruler
              admin: loki-data-admin
            
          # 스키마 설정 (유지)
          schemaConfig:
            configs:
              - from: 2020-10-25
                store: boltdb-shipper
                object_store: filesystem
                schema: v11
                index:
                  prefix: index_
                  period: 24h

        promtail:
          enabled: true
          config:
            lokiAddress: http://logging-loki:3100/loki/api/v1/push
            
        service:
          type: NodePort
          nodePort: 30100