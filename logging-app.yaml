apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: logging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # CRD 충돌 방지

  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 6.x.x 
    
    helm:
      values: |
        loki:
          image:
            tag: 3.6.0
            
          auth_enabled: false
          deploymentMode: Monolithic
          
          # [핵심 수정] 설치 오류 해결: Loki 스키마 정의 추가
          schemaConfig:
            configs:
              - from: 2020-10-25  # 스키마 적용 시작 날짜 (현재보다 과거여야 함)
                store: boltdb-shipper
                object_store: filesystem # 파일 시스템 사용 명시
                schema: v11
                index:
                  prefix: index_
                  period: 24h

          # [필수] 버킷 이름 정의 (설치 오류 해결)
          storage:
            bucketNames:
              chunks: loki-data-chunks
              ruler: loki-data-ruler
              admin: loki-data-admin

        promtail:
          enabled: true
          config:
            lokiAddress: http://logging-loki:3100/loki/api/v1/push
            
        service:
          type: NodePort
          nodePort: 30100