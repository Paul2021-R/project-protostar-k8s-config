apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: logging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # CRD 충돌 방지

  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 6.x.x 
    
    helm:
      values: |
        loki:
          image:
            tag: 3.6.0
            
          auth_enabled: false
          
          # [핵심 수정] Filesystem 스토리지를 사용하고, Monolithic 모드를 강제합니다.
          deploymentMode: SingleBinary
          
          # [저장소 설정] PV/PVC를 사용하는 Filesystem으로 명시합니다.
          storage:
            type: filesystem
            filesystem: {}
            bucketNames:
              chunks: loki-data-chunks
              ruler: loki-data-ruler
              admin: loki-data-admin
            
          # 분산 모드 컴포넌트 비활성화 (오작동 방지)
          backend:
            enabled: false
          read:
            enabled: false
          write:
            enabled: false
          
          # 스키마 설정 (유지)
          schemaConfig:
            configs:
              - from: 2020-10-25
                store: boltdb-shipper
                object_store: filesystem
                schema: v11
                index:
                  prefix: index_
                  period: 24h

        promtail:
          enabled: true
          config:
            lokiAddress: http://logging-loki:3100/loki/api/v1/push
            
        service:
          type: NodePort
          nodePort: 30100