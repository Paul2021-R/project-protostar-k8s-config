apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: logging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  
  syncPolicy:
    automated:
      prune: false              # ← false
      selfHeal: false           # ← false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=false   # ← false (race condition 원인)
      - RespectIgnoreDifferences=true  # ← 추가

  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 6.x.x 
    
    helm:
      values: |
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 3
          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: s3
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
          limits_config:
            allow_structured_metadata: true
            volume_enabled: true
            
          ruler:
            enable_api: true
            
          storage:
            type: s3
            bucketNames:
              chunks: loki-data-chunks
              ruler: loki-data-ruler
              admin: loki-data-admin
            s3:
              endpoint: logging-minio:9000
              insecure: true
              accessKeyId: admin
              secretAccessKey: supersecret
              
        deploymentMode: SingleBinary

        singleBinary:
          replicas: 3
          persistence:
            enabled: true
            storageClassName: microk8s-hostpath
            size: 5Gi

        backend:
          replicas: 0
        read:
          replicas: 0
        write:
          replicas: 0

        ingester:
          replicas: 0
        querier:
          replicas: 0
        queryFrontend:
          replicas: 0
        queryScheduler:
          replicas: 0
        distributor:
          replicas: 0
        compactor:
          replicas: 0
        indexGateway:
          replicas: 0
        bloomCompactor:
          replicas: 0
        bloomGateway:
          replicas: 0

        minio:
          enabled: true
          auth:
            rootUser: admin
            rootPassword: supersecret
            
        promtail:
          enabled: true
          config:
            clients:
              - url: http://logging-loki:3100/loki/api/v1/push
            
        service:
          type: NodePort
          nodePort: 30100