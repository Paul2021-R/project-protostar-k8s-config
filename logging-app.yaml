apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: logging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # CRD 충돌 방지

  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 6.x.x 
    
    helm:
      values: |
        loki:
          # 1. [순정 버전] Grafana v12 호환성 확보
          image:
            tag: 3.6.0
            
          # 2. [인증] 인증 비활성화
          auth_enabled: false

          # 3. [TSDB 스키마] 최신 v13 및 S3 저장소 명시
          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: s3
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
          
          # 4. [메타데이터] 최신 버전의 엄격한 유효성 검사 우회
          limits_config:
            allow_structured_metadata: true # TSDB를 사용하므로 활성화
            volume_enabled: true
            
          # 5. [파드 모드] Monolithic 모드 강제
          deploymentMode: SingleBinary
          singleBinary:
            replicas: 1
            
          # 6. [컴포넌트 클리어] 유효성 검사 오류 방지: 모든 분산 컴포넌트 복제본 0 설정
          backend:
            replicas: 0
          read:
            replicas: 0
          write:
            replicas: 0
          ingester:
            replicas: 0
          querier:
            replicas: 0
          queryFrontend:
            replicas: 0
          queryScheduler:
            replicas: 0
          distributor:
            replicas: 0
          compactor:
            replicas: 0
          indexGateway:
            replicas: 0
          bloomCompactor:
            replicas: 0
          bloomGateway:
            replicas: 0

        # 7. [저장소] S3 저장을 위해 MinIO 서브차트 활성화
        minio:
          enabled: true
          
        # 8. [네트워킹] NodePort 및 Promtail 설정
        promtail:
          enabled: true
          config:
            clients:
              - url: http://logging-loki:3100/loki/api/v1/push
            
        service:
          type: NodePort
          nodePort: 30100