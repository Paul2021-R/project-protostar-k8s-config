apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: logging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # CRD 충돌 방지

  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 6.x.x 
    
    helm:
      values: |
        loki:
          # 1. [순정 버전] Loki 이미지 버전을 3.6.0으로 강제 지정
          image:
            tag: 3.6.0
            
          auth_enabled: false
          
          # 2. [순정 모드] 단일 파드(Monolithic) 모드 사용
          deploymentMode: Monolithic
          replicas: 1

          # 3. [순정 설정] Monolithic 파드에 필요한 PVC 설정 (최상위 레벨)
          persistence:
            enabled: true
            storageClassName: microk8s-hostpath 
            size: 10Gi
            
          # 4. [오류 해결] 분산 컴포넌트 복제본을 0으로 강제하여 유효성 검사 통과
          backend:
            replicas: 0
          read:
            replicas: 0
          write:
            replicas: 0
            
          # 5. [필수 설정] 저장소 타입과 스키마 정의 (최신 차트 필수 요구 사항)
          storage:
            type: filesystem
            bucketNames:
              chunks: loki-data-chunks
              ruler: loki-data-ruler
              admin: loki-data-admin
          
          schemaConfig:
            configs:
              - from: 2020-10-25
                store: boltdb-shipper
                object_store: filesystem
                schema: v11
                index:
                  prefix: index_
                  period: 24h

        promtail:
          enabled: true
          config:
            clients:
              - url: http://logging-loki:3100/loki/api/v1/push
            
        service:
          type: NodePort
          nodePort: 30100