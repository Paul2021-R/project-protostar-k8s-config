apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme: 
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ryu.axel@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers: 
    - selector:
        dnsNames:
          - "*.paulryu93.ddns.net"
      http01:
        gatewayHTTPRoute:
          parentRefs:
          - name: infra-gateway
            namespace: infra-gateway
    - selector:
        dnsNames:
          - "*.protostar.ddns.net"
      http01:
        gatewayHTTPRoute:
          parentRefs:
          - name: service-gateway
            namespace: service-gateway