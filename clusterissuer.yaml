apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme: 
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ryu.axel@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers: 
      - selector:
          dnsNames:
            - "minio.paulryu93.ddns.net"
            - "n8n.paulryu93.ddns.net"
            - "jenkins.paulryu93.ddns.net"
        http01:
          gatewayHTTPRoute:
            parentRefs:
            - name: infra-gateway
              namespace: infra-gateway
      - selector:
          dnsNames:
            - "service-protostar.ddns.net"
            - "back-protostar.ddns.net"
            - "back-ai-protostar.ddns.net"
        http01:
          gatewayHTTPRoute:
            parentRefs:
            - name: service-gateway
              namespace: service-gateway