# monitoring-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 65.x.x
    
    helm:
      values: |
        # 1. Grafana 설정 (K8s 내부용 - 비상용/디버깅용)
        grafana:
          adminPassword: "protostar_pass"
          service:
            type: NodePort
            nodePort: 30300 # A5서버IP:30300으로 접속 가능

        # 2. Prometheus 설정 (Centre 서버 연동을 위한 핵심)
        prometheus:
          prometheusSpec:
            storageSpec:
              volumeClaimTemplate:
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 20Gi
            # [핵심] 외부(Centre)에서 데이터를 긁어갈 수 있도록 NodePort 개방
            service:
              type: NodePort
              nodePort: 30090