# infrastructure/logging/loki-config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: logging-loki-config
  namespace: logging
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
      grpc_listen_port: 9095

    common:
      path_prefix: /loki
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.0 # localhost에서 변경
        kvstore:
          store: inmemory

    # [핵심 수정] 누락된 limits_config 블록 추가
    limits_config:
      allow_structured_metadata: false

    schema_config:
      configs:
        - from: 2020-10-25
          store: boltdb-shipper
          object_store: filesystem
          schema: v11
          index:
            prefix: index_
            period: 24h

    storage_config:
      boltdb_shipper:
        active_index_directory: /data/loki/index
        cache_location: /data/loki/cache
        cache_ttl: 24h
      filesystem:
        directory: /data/loki/chunks
    
    ruler: {}
    compactor: {}