apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Helm Chart를 사용하여 리소스 생성
helmCharts:
- name: grafana
  repo: https://grafana.github.io/helm-charts
  version: 8.5.1 # (안정적인 차트 버전. 이 버전이 Grafana v11.x~v12.x를 설치해줍니다)
  releaseName: grafana
  namespace: monitoring
  valuesFile: values.yaml