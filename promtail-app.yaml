apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: promtail
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: logging # Loki와 같은 네임스페이스에 배포
  
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: promtail # <-- Loki 차트가 아닌 Promtail 전용 차트 사용
    targetRevision: 6.15.3 # 안정적인 버전 지정 (또는 6.x.x)
    
    helm:
      values: |
        # DaemonSet 설정: 모든 노드에서 로그를 수집하도록 합니다.
        daemonset:
          enabled: true
        
        # Loki 연결 설정 (핵심)
        config:
          clients:
            - url: http://logging-loki:3100/loki/api/v1/push
              # logging-loki: Loki 서비스 이름 (ClusterIP 사용)
              # 3100: Loki 내부 포트 (외부 NodePort 변경과 무관하게 고정됨)

        # 파이프라인 설정 (선택 사항: docker/containerd 로그 파싱 최적화)
        # 기본 설정으로도 대부분 동작하지만, 수집이 안 될 경우 확인 필요