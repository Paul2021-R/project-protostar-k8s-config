apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: infra-pool
  namespace: metallb-system
spec:
  addressses:
  - 192.168.0.41/32
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: service-pool
  namespace: metallb-system
spec:
  addressses:
  - 192.168.0.37/32
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: infra-advert
  namespace: metallb-system
spec:
  IPAddressPools:
  - infra-pool
  nodeSelectors:
  - matchLabels:
    kubernetes.io/hostname: thinkcentre
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: service-advert
  namespace: metallb-system
spec:
  IPAddressPools:
  - service-pool
  nodeSelectors:
  - matchLabels:
    kubernetes.io/hostname: hansol-a5    