# prod/infra/httproute.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: minio-route
  namespace: infra
spec:
  parentRefs:
    - name: infra-gateway
      namespace: infra-gateway
  hostnames:
    - "minio.paulryu93.ddns.net"
  rules:
    - backendRefs:
        - name: minio
          port: 9001
