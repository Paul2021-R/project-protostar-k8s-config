apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: couchdb-route
  namespace: infra
spec:
  parentRefs:
    - name: infra-gateway
      namespace: infra-gateway
  hostnames:
    - "couchdb.paulryu93.ddns.net"
  rules:
    - backendRefs:
        - name: couchdb
          port: 5984
