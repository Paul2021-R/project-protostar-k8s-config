# prod/infra/httproute.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: minio-route
  namespace: infra
spec:
  parentRefs:
    - name: infra-gateway
      namespace: infra-gateway
  hostnames:
    - "minio.paulryu93.ddns.net"
  rules:
    - backendRefs:
        - name: minio
          port: 9001
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: n8n-route
  namespace: infra
spec:
  parentRefs:
    - name: infra-gateway
      namespace: infra-gateway
  hostnames:
    - "n8n.paulryu93.ddns.net"
  rules:
    - backendRefs:
        - name: n8n
          port: 5678