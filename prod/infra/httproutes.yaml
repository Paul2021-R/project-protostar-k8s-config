apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backup-snacks-route
  namespace: infra
spec:
  parentRefs:
    - name: infra-gateway
      namespace: infra-gateway
  hostnames:
    - "backup-snacks.paulryu93.ddns.net"
  rules:
    - filters:
        # 요청 body 를 nginx 가 디스크에 받아 두지 않고 그대로 흘린다 (backup-snacks-policy.yaml)
        - type: ExtensionRef
          extensionRef:
            group: gateway.nginx.org
            kind: SnippetsFilter
            name: backup-snacks-no-request-buffering
      backendRefs:
        - name: backup-snacks
          port: 18080
