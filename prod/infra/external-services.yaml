# infra/external-services.yaml
apiVersion: v1
kind: Endpoints
metadata:
  name: minio
  namespace: infra
subsets:
  - addresses:
      - ip: 192.168.0.41
    ports:
      - name: api
        port: 9000
      - name: console
        port: 9001
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: infra
spec:
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
apiVersion: v1
kind: Endpoints
metadata:
  name: n8n
  namespace: infra
subsets:
  - addresses:
      - ip: 192.168.0.41
    ports:
      - name: web
        port: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: infra
spec:
  ports:
    - name: web
      port: 5678
      targetPort: 5678